  <text x="72" y="38" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1E2D5A" letter-spacing="-0.5">Repliq</text>

  <!-- Tagline -->
  <text x="73" y="54" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#64748B">AI communication for sport events</text>
